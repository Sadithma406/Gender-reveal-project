server {
    listen 80;
    server_name localhost;

    # Where our website files live inside the container
    root /usr/share/nginx/html;

    # IMPORTANT: Your main page is gender.html, not index.html
    # Without this, visiting localhost:8080 would show a 403 error
    index gender.html;

    location / {
        # Try to serve the exact file requested, 
        # then try it as a directory, 
        # then fall back to gender.html
        try_files $uri $uri/ /gender.html;
    }

    # Cache static assets for better performance
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|mp4|webm)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
